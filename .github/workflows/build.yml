name: Build desktop apps

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish Windows/PrivatePresenter/PrivatePresenter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows document editing and tray lifecycle
        shell: pwsh
        run: |
          $test = Start-Process release/windows/PrivatePresenter.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content release/windows/self-test.log
          if ($test.ExitCode -ne 0) { throw "Windows self-tests failed with exit code $($test.ExitCode)" }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/install-windows.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Package Windows
        shell: pwsh
        run: |
          Remove-Item release/windows/self-test.log
          Compress-Archive -Path release/windows/* -DestinationPath release/PrivatePresenter-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/PrivatePresenter-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test macOS
        run: swift test
      - name: Build universal macOS app
        run: PRIVATE_PRESENTER_UNIVERSAL=1 ./build_app.sh
      - name: Verify and package macOS
        run: |
          codesign --verify --deep --strict 'dist/Private Presenter.app'
          architectures="$(lipo -archs 'dist/Private Presenter.app/Contents/MacOS/PrivatePresenter')"
          [[ " $architectures " == *" arm64 "* && " $architectures " == *" x86_64 "* ]]
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent 'dist/Private Presenter.app' release/PrivatePresenter-macos-universal.zip
          bash -n scripts/install-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/PrivatePresenter-macos-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS --title "Private Presenter $GITHUB_REF_NAME" --notes 'Native Windows x64 and universal macOS builds. See the README for one-command installation. These community builds are not notarized or publisher-signed. Capture exclusion depends on the capture application and OS; verify your sharing setup.'
